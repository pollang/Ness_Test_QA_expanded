testing:
  sampling:
    measurements_count: 20
    total_duration_seconds: 10
    sampling_frequency_hz: 5
  error_injection:
    drop_probability: 0  # 0 = disabled; set > 0 (e.g. 0.1) to exercise the framework's error-handling path

ammeters:
  greenlee:
    port: 5001
    command: "MEASURE_GREENLEE -get_measurement"
  entes:
    port: 5002
    command: "MEASURE_ENTES -get_data"
  circutor:
    port: 5003
    command: "MEASURE_CIRCUTOR -get_measurement -current"

analysis:
  statistical_metrics: [mean, median, stdev, min, max, coefficient_of_variation]
  visualization:
    enabled: true
    plot_types: [line, histogram]

result_management:
  results_dir: results
  keep_raw_readings: true
